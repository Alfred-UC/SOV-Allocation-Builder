<style>
/* Layout: a pocket G703 continuation sheet. Sheet tabs pinned on top, ruled line items
   in the middle, the contract sum pinned at the bottom like the G702 summary line. */
:root {
  --bg: #ECEFF1;
  --surface: #FFFFFF;
  --surface-2: #F3F5F7;
  --ink: #111920;
  --ink-2: #414E58;
  --muted: #66727C;
  --line: #D1D7DB;
  --line-2: #E3E7EA;
  --accent: #1C5CAB;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1EBF7;
  --ok: #0CA30C;
  --watch: #FAB219;
  --fix: #D03B3B;
  --on-ok: #FFFFFF;
  --on-watch: #3A2A00;
  --on-fix: #FFFFFF;
  --neg: #B83232;
  --seg-1: #104281;
  --seg-2: #1C5CAB;
  --seg-3: #2A78D6;
  --seg-4: #5598E7;
  --seg-5: #86B6EF;
  --bar-muted: #B9C2C9;
  --shadow: 0 1px 2px rgba(17, 25, 32, .06);
  --scrim: rgba(17, 25, 32, .9);
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1114;
    --surface: #151A1E;
    --surface-2: #1C2227;
    --ink: #EBF0F3;
    --ink-2: #B3BDC5;
    --muted: #87939D;
    --line: #2C343B;
    --line-2: #232A30;
    --accent: #6DA7EC;
    --accent-ink: #0A1522;
    --accent-soft: #1A2A3D;
    --neg: #F08080;
    --seg-1: #B7D3F6;
    --seg-2: #86B6EF;
    --seg-3: #5598E7;
    --seg-4: #2A78D6;
    --seg-5: #1C5CAB;
    --bar-muted: #46515A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --scrim: rgba(235, 240, 243, .94);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1114;
  --surface: #151A1E;
  --surface-2: #1C2227;
  --ink: #EBF0F3;
  --ink-2: #B3BDC5;
  --muted: #87939D;
  --line: #2C343B;
  --line-2: #232A30;
  --accent: #6DA7EC;
  --accent-ink: #0A1522;
  --accent-soft: #1A2A3D;
  --neg: #F08080;
  --seg-1: #B7D3F6;
  --seg-2: #86B6EF;
  --seg-3: #5598E7;
  --seg-4: #2A78D6;
  --seg-5: #1C5CAB;
  --bar-muted: #46515A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  --scrim: rgba(235, 240, 243, .94);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
img, svg { max-width: 100%; }

.app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 10px calc(96px + env(safe-area-inset-bottom, 0px)); }

/* type */
.eyebrow { font: 600 12px/1.2 var(--font-display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.note { font-size: 12.5px; line-height: 1.45; color: var(--muted); margin: 0; }
.lead { margin: 6px 0 10px; color: var(--ink-2); font-size: 14px; }
.muted { color: var(--muted); font-weight: 400; }
h1, h2 { text-wrap: balance; }

/* masthead */
.masthead { padding-block: 6px 12px; }
.masthead h1 { margin: 0; font: 700 28px/1.02 var(--font-display); letter-spacing: .005em; }
.masthead p { margin: 5px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 60ch; }

/* tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 13px 2px 10px; font: 600 15px/1 var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tbadge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font: 600 11px/1 var(--font-body); letter-spacing: 0; }
.tbadge.fix { background: var(--fix); color: var(--on-fix); }
.tbadge.watch { background: var(--watch); color: var(--on-watch); }

.panel { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.banner { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.linkbtn { appearance: none; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

/* buttons */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px/1.2 var(--font-body); padding: 10px 14px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; font-size: 14px; padding: 8px 12px; }
.btn.armed { border-color: var(--fix); color: var(--neg); }
.btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn { appearance: none; width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; font-size: 13px; font-weight: 600; }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn.armed { width: auto; padding: 0 10px; border-color: var(--fix); color: var(--neg); }
:is(.btn, .icon-btn, .tab, .linkbtn, .seg-ctl button, .row, .status-btn):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* fields */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.txt { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 9px; padding: 10px 11px; font: 400 16px/1.3 var(--font-body); }
.txt.strong { font-weight: 600; }
.txt:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp { display: flex; align-items: center; gap: 3px; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; }
.inp:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp .pre, .inp .suf { color: var(--muted); font-size: 15px; flex: none; }
.inp input { flex: 1 1 auto; min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 16px/1.3 var(--font-body); padding: 10px 0; font-variant-numeric: tabular-nums; }
.inp input::placeholder, .txt::placeholder { color: var(--muted); opacity: .75; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* systems */
.sys { display: flex; flex-direction: column; gap: 12px; }
.sys-head { display: flex; align-items: flex-end; gap: 10px; }
.sys-head .field { flex: 1 1 auto; }
.sys-total { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 10px; border-top: 1px solid var(--line-2); font-size: 13px; color: var(--ink-2); }
.sys-total b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
details.areas { border-top: 1px solid var(--line-2); padding-top: 10px; }
details.areas summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); list-style-position: inside; }
.area-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.area-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px 38px; gap: 8px; align-items: center; }
.sys-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.sys-actions .btn { flex: 1 1 160px; }

/* posture */
.seg-ctl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 11px; border: 1px solid var(--line-2); margin-top: 8px; }
.seg-ctl button { appearance: none; border: 0; background: transparent; color: var(--ink-2); font: 600 14px/1.15 var(--font-body); padding: 10px 6px; border-radius: 8px; cursor: pointer; min-width: 0; }
.seg-ctl button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.posture .note { margin-top: 9px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-width: 0; }
.recap { display: flex; flex-direction: column; padding-top: 10px; border-top: 1px solid var(--line-2); font-size: 13.5px; }
.rc { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 3px 0; color: var(--ink-2); }
.rc span:first-child { min-width: 0; }
.rc span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
.rc.tot { margin-top: 4px; padding-top: 7px; border-top: 1px solid var(--line-2); font-weight: 600; color: var(--ink); }
.rc.sub { font-size: 12.5px; color: var(--muted); }
.tie { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 10px; padding: 9px 10px; border-radius: 9px; background: var(--surface-2); font-size: 13.5px; color: var(--ink-2); }
.tie .tie-txt { flex: 1 1 150px; min-width: 0; }
.tie .btn { min-height: 36px; padding: 6px 10px; font-size: 13.5px; }
.hero-tie { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; font-size: 14px; font-weight: 500; color: var(--ink-2); }

/* KPIs */
.hero-num { font-size: clamp(36px, 10.5vw, 48px); font-weight: 600; letter-spacing: -.015em; line-height: 1.05; margin: 4px 0 2px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px; min-width: 0; }
.t-lbl { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.t-num { display: flex; align-items: center; gap: 6px; font-size: 19px; font-weight: 600; margin-top: 2px; line-height: 1.2; }
.t-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; line-height: 1.35; }
@media (max-width: 420px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tiles .tile:last-child { grid-column: 1 / -1; } }

/* cash-flow bar */
.flow { margin-top: 18px; }
.flow-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.flowbar { position: relative; display: flex; gap: 2px; height: 20px; margin-top: 10px; }
.seg { flex-basis: 0; min-width: 3px; height: 100%; cursor: pointer; }
.seg:first-of-type { border-radius: 4px 0 0 4px; }
.seg:last-of-type { border-radius: 0 4px 4px 0; }
.seg:only-of-type { border-radius: 4px; }
.s1 { background: var(--seg-1); } .s2 { background: var(--seg-2); } .s3 { background: var(--seg-3); } .s4 { background: var(--seg-4); } .s5 { background: var(--seg-5); }
.flow-tip { position: absolute; bottom: calc(100% + 8px); transform: translateX(-50%); background: var(--scrim); color: var(--surface); font-size: 12.5px; font-weight: 500; padding: 6px 9px; border-radius: 7px; white-space: nowrap; pointer-events: none; z-index: 5; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-direction: column; margin-top: 10px; }
.lg { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 58px; gap: 10px; align-items: center; padding: 6px 6px; border-radius: 7px; font-size: 13.5px; }
.lg.hl { background: var(--accent-soft); }
.sw { width: 12px; height: 12px; border-radius: 3px; }
.lg-amt, .lg-pc { font-variant-numeric: tabular-nums; text-align: right; }
.lg-pc { color: var(--muted); }

/* SOV sheet */
.sheet { padding: 0; overflow: hidden; }
.sheet-title { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 14px 14px 10px; }
.sheet-head, .row, .total-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; padding-inline: 14px; }
.sheet-head { padding-block: 8px; background: var(--surface-2); border-block: 1px solid var(--line); font: 600 11px/1.2 var(--font-display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.r { text-align: right; }
.grp { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 14px 6px; font: 700 12.5px/1.2 var(--font-display); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.grp-sub { font: 500 12px/1.2 var(--font-body); letter-spacing: 0; text-transform: none; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row { padding-block: 10px; border-top: 1px solid var(--line-2); cursor: pointer; align-items: start; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: calc(100% - 32px); background: var(--scrim); color: var(--surface); padding: 10px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 4px 16px rgba(0, 0, 0, .18); }

<body>
<div class="app">
  <header class="masthead">
    <h1>SOV Allocation Builder</h1>
    <p>Turn a cost estimate into a schedule of values that front-loads inside the limits a GC will accept.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-systems" data-tab="systems" aria-controls="panel-systems" type="button">Systems</button>
    <button class="tab" role="tab" id="tab-sov" data-tab="sov" aria-controls="panel-sov" type="button">SOV</button>
    <button class="tab" role="tab" id="tab-review" data-tab="review" aria-controls="panel-review" type="button">Review <span id="review-badge"></span></button>
    <button class="tab" role="tab" id="tab-settings" data-tab="settings" aria-controls="panel-settings" type="button">Settings</button>
  </nav>
  <main>
    <section class="panel" id="panel-systems" role="tabpanel" aria-labelledby="tab-systems"></section>
    <section class="panel" id="panel-sov" role="tabpanel" aria-labelledby="tab-sov"></section>
    <section class="panel" id="panel-review" role="tabpanel" aria-labelledby="tab-review"></section>
    <section class="panel" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings"></section>
  </main>
</div>
<div class="sumbar" id="sumbar"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<datalist id="sys-names">
  <option value="Insulated Metal Panels (IMP)"></option>
  <option value="Metal Composite Material (MCM / ACM)"></option>
  <option value="Fiber Cement Panels"></option>
  <option value="Phenolic / HPL Panels"></option>
  <option value="Translucent Panel System (Kalwall)"></option>
  <option value="Single-Skin Metal Wall Panels"></option>
  <option value="Aluminum Canopy"></option>
  <option value="Soffit Panels"></option>
  <option value="Roofing Sheet Metal / Trims"></option>
</datalist>
<script>
/* SOV allocation engine. Pure functions, no DOM. All money is integer cents. */
(function (root) {
  'use strict';

  // Ranges and selected values come from the Orafol "Percentage Framework" sheet.
  // group = which posture setting moves the line (front / ongoing / tail).
  // phase = when it can actually be billed: before you're on site, at site start, during progress, at closeout.
  const GENERAL = [
    { id: 'safety', group: 'front', phase: 'start', label: 'Safety & Site Startup', low: 0.25, sel: 0.50, high: 0.75, timing: 'Site start',
      guide: 'Bill once you are on site and startup and safety obligations are under way. Not billable before mobilization.' },
    { id: 'mob', group: 'front', phase: 'start', label: 'Mobilization', low: 0.50, sel: 0.80, high: 1.50, timing: 'Site start',
      guide: 'Bill when crews and equipment are on site to begin the work.' },
    { id: 'submittals', group: 'front', phase: 'precon', label: 'Submittals', low: 0.50, sel: 0.75, high: 1.00, timing: 'Before site',
      guide: 'Bill on completion or acceptance of the required submittals.' },
    { id: 'insurance', group: 'front', phase: 'precon', label: 'Insurance & Contract Compliance', low: 0.50, sel: 1.00, high: 1.25, timing: 'Before site',
      guide: 'Keep this supportable by actual project insurance and compliance cost. It is not a profit bucket.' },
    { id: 'shops', group: 'front', phase: 'precon', label: 'Shop Drawings & Coordination', low: 0.75, sel: 1.20, high: 1.50, timing: 'Before site',
      guide: 'Bill as shop drawings and coordination are completed and accepted. State PE stamps and calcs as excluded when the contract excludes them.' },
    { id: 'pm', group: 'ongoing', phase: 'ongoing', label: 'Project Management / Coordination', low: 2.50, sel: 3.11, high: 4.00, timing: 'Monthly',
      guide: 'Bill pro rata over the active duration. Billing it early reads as overhead front-loading.' },
    { id: 'cleanup', group: 'tail', phase: 'tail', label: 'Cleanup / Punch', low: 0.25, sel: 0.50, high: 0.75, timing: 'Punch',
      guide: 'Hold for final cleanup and punch completion.' },
    { id: 'closeout', group: 'tail', phase: 'tail', label: 'Closeout: O&M, As-Builts, Warranties, Lien Waivers', low: 0.50, sel: 0.50, high: 1.00, timing: 'Closeout',
      guide: 'Bill when O&M manuals, as-builts, warranties and lien waivers are delivered. Final payment usually depends on it.' }
  ];

  const EQUIP = {
    id: 'equip', low: 2.0, high: 4.0, label: 'Hoisting, Lifts & Equipment: Delivery / Usage',
    guide: 'Bill with delivery and actual usage across the work, not all at mobilization. Carries equipment cost plus its share of profit.'
  };
  const BOND_GUIDE = 'Bill at the first requisition with the surety invoice attached.';
  const MAT_GUIDE = 'Carries material cost, sales tax and the material share of profit. Bill as material is procured, stored or delivered; expect the GC to ask for invoices, bills of lading and stored-material insurance.';
  const LAB_GUIDE = 'Bill by measurable installed percent complete.';

  const POSTURES = {
    conservative: { label: 'Conservative', front: 'low', tail: 'high', pm: 'sel' },
    balanced: { label: 'Balanced', front: 'sel', tail: 'sel', pm: 'sel' },
    max: { label: 'Max defensible', front: 'high', tail: 'sel', pm: 'sel' }
  };

  const DEFAULT_SETTINGS = { taxRate: 6.35, laborFloor: 5, matComfort: 10, matCap: 15, retainage: 5, bond: 0, rounding: 50 };

  function num(x) { const n = Number(x); return isFinite(n) ? n : 0; }
  function toCents(d) { return Math.round(num(d) * 100); }
  function roundTo(c, unit) { return Math.round(c / unit) * unit; }
  function usd(c) {
    const a = Math.abs(c) / 100;
    const cents = Math.round(Math.abs(c)) % 100 !== 0;
    return (c < 0 ? '−$' : '$') + a.toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: 2 });
  }

  // Largest-remainder split of an integer total into multiples of `unit`;
  // any sub-unit remainder goes to the heaviest weight. Sum is exact.
  function allocate(total, weights, unit) {
    const n = weights.length;
    if (!n) return [];
    let w = weights.map(x => Math.max(0, num(x)));
    let sumW = w.reduce((a, b) => a + b, 0);
    if (sumW <= 0) { w = w.map(() => 1); sumW = n; }
    const sign = total < 0 ? -1 : 1;
    const abs = Math.abs(total);
    const units = Math.floor(abs / unit);
    const rem = abs - units * unit;
    const raw = w.map(x => units * x / sumW);
    const base = raw.map(Math.floor);
    const left = units - base.reduce((a, b) => a + b, 0);
    const order = raw.map((r, i) => [r - base[i], i]).sort((a, b) => (b[0] - a[0]) || (a[1] - b[1]));
    for (let k = 0; k < left; k++) base[order[k % n][1]]++;
    const out = base.map(b => b * unit);
    let imax = 0;
    for (let i = 1; i < n; i++) if (w[i] > w[imax]) imax = i;
    out[imax] += rem;
    return out.map(x => x * sign);
  }

  // The estimate recap, exactly as the estimator prices a system:
  //   Subtotal = material + labor + equipment/fixed
  //   Overhead = OH% x subtotal;  Profit = P% x (subtotal + overhead)
  //   Tax = tax% x material (not marked up)
  //   Price = subtotal + overhead + profit + tax, rounded to the dollar for the SOV.
  function priceSystem(s, taxRate) {
    s = s || {};
    const M = Math.max(0, toCents(s.M)), L = Math.max(0, toCents(s.L)), E = Math.max(0, toCents(s.E));
    const oh = num(s.oh), pr = num(s.pr), tr = Math.max(0, num(taxRate));
    const Sub = M + L + E;
    const OH = Math.round(Sub * oh / 100);
    const SubOH = Sub + OH;
    const PR = Math.round(SubOH * pr / 100);
    const TAX = Math.round(M * tr / 100);
    const price = SubOH + PR + TAX;
    return { M, L, E, oh, pr, Sub, OH, SubOH, PR, TAX, price, V: Math.round(price / 100) * 100 };
  }

  // Profit % (4 decimals) that makes a system price out to the entered total; null if it can't.
  function tieProfit(s, taxRate, totalDollars) {
    const T = toCents(totalDollars);
    const base = priceSystem(Object.assign({}, s, { pr: 0 }), taxRate);
    if (T <= 0 || base.SubOH <= 0 || T % 100 !== 0) return null;
    const p0 = (T - base.TAX - base.SubOH) / base.SubOH * 100;
    if (!isFinite(p0) || p0 < 0) return null;
    let p = Math.round(p0 * 1e4) / 1e4;
    for (let k = 0; k < 400; k++) {
      const v = priceSystem(Object.assign({}, s, { pr: p }), taxRate).V;
      if (v === T) return p;
      p = Math.round((p + (v < T ? 1e-4 : -1e-4)) * 1e4) / 1e4;
      if (p < 0) return null;
    }
    return null;
  }

  function presetPct(key) {
    const p = POSTURES[key] || POSTURES.balanced;
    const out = {};
    GENERAL.forEach(g => {
      const pick = g.group === 'front' ? p.front : g.group === 'tail' ? p.tail : p.pm;
      out[g.id] = g[pick];
    });
    return out;
  }

  function cleanAreas(areas) {
    return (Array.isArray(areas) ? areas : [])
      .filter(a => a && String(a.name || '').trim())
      .map(a => ({ name: String(a.name).trim(), w: Math.max(0, num(a.w)) }));
  }

  function compute(input) {
    input = input || {};
    const s = Object.assign({}, DEFAULT_SETTINGS, input.settings || {});
    const R = Math.max(1, Math.round(num(s.rounding) || 1)) * 100;
    const f = Math.max(0, num(s.laborFloor)) / 100;
    const matCap = Math.max(0, num(s.matCap)) / 100;
    const matComfort = Math.max(0, num(s.matComfort)) / 100;
    const retPct = Math.max(0, num(s.retainage)) / 100;
    const taxRate = Math.max(0, num(s.taxRate));

    let posture = input.posture;
    const isCustom = posture === 'custom' && !!input.custom;
    if (!isCustom && !POSTURES[posture]) posture = 'balanced';
    const contract = Math.max(0, toCents(input.contract));

    const inSys = input.systems || [];
    const all = inSys.map((x, i) => {
      x = x || {};
      return Object.assign(priceSystem(x, taxRate), {
        idx: i, name: String(x.name || '').trim() || ('System ' + (i + 1)), scope: String(x.scope || '').trim(),
        T: Math.max(0, toCents(x.total)), areas: cleanAreas(x.areas)
      });
    });
    const sys = all.filter(x => x.V > 0);
    const badSys = all.filter(x => x.V <= 0 && (x.M || x.L || x.E));
    const C = sys.reduce((a, x) => a + x.V, 0);
    if (C <= 0) return { empty: true, badSys, posture: isCustom ? 'custom' : posture, contract };

    const pct = isCustom ? Object.assign(presetPct('balanced'), input.custom.pct || {}) : presetPct(posture);
    GENERAL.forEach(g => { pct[g.id] = Math.max(0, num(pct[g.id])); });

    // General lines: % of the SOV total, rounded to the chosen unit. Overhead is what pays for them.
    const gen = GENERAL.map(g => Object.assign({}, g, { pct: pct[g.id], value: roundTo(C * pct[g.id] / 100, R) }));
    const bond = Math.max(0, toCents(s.bond));
    const G = gen.reduce((a, g) => a + g.value, 0) + bond;
    const Galloc = allocate(G, sys.map(x => x.V), 100); // pro-rata by system value, like the Orafol reconciliation

    // Profit rides on each cost line in proportion to its cost. Tax stays with material, unmarked.
    const share = (x, part) => (x.Sub > 0 ? x.PR * part / x.Sub : 0);
    const eqRaw = sys.map(x => x.E + share(x, x.E));
    const sumEqRaw = eqRaw.reduce((a, b) => a + b, 0);
    const EQ = sumEqRaw > 0 ? Math.round(sumEqRaw / 100) * 100 : 0;
    const EQalloc = sumEqRaw > 0 ? allocate(EQ, eqRaw, 100) : sys.map(() => 0);
    const mat = sys.map(x => (x.M > 0 ? Math.round((x.M + x.TAX + share(x, x.M)) / 100) * 100 : 0));
    const labor = sys.map((x, i) => x.V - mat[i] - EQalloc[i] - Galloc[i]); // labor + its profit + overhead the general lines don't use
    const floor = sys.map(x => Math.ceil(x.L * (1 + f)));
    const mk = sys.map((x, i) => (x.M > 0 ? (mat[i] - x.M - x.TAX) / (x.M + x.TAX) : null)); // markup over invoice (material + tax)

    // SOV lines in billing order.
    const lines = [];
    const add = (group, o) => lines.push(Object.assign({ group }, o));
    const addGen = phase => gen.filter(g => g.phase === phase && g.value !== 0).forEach(g =>
      add(phase, { id: g.id, desc: g.label, value: g.value, timing: g.timing, guide: g.guide }));
    if (bond > 0) add('precon', { id: 'bond', desc: 'Payment & Performance Bond', value: bond, timing: 'Before site', guide: BOND_GUIDE });
    addGen('precon');
    addGen('start');
    if (EQ > 0) add('ongoing', { id: 'equip', desc: EQUIP.label, value: EQ, timing: 'With usage', guide: EQUIP.guide });
    addGen('ongoing');
    sys.forEach((x, i) => {
      if (mat[i] > 0) add('materials', { id: 'mat-' + x.idx, desc: x.name + ': Material', scope: x.scope, value: mat[i], timing: 'Stored / delivered', guide: MAT_GUIDE, sys: x.idx });
    });
    sys.forEach((x, i) => {
      if (labor[i] === 0 && x.L === 0) return;
      if (x.areas.length) {
        const parts = allocate(labor[i], x.areas.map(a => a.w), 100);
        x.areas.forEach((a, k) => add('labor', {
          id: 'lab-' + x.idx + '-' + k, desc: x.name + ': Labor, ' + a.name, scope: x.scope,
          value: parts[k], timing: '% complete', guide: LAB_GUIDE, sys: x.idx
        }));
      } else {
        add('labor', { id: 'lab-' + x.idx, desc: x.name + ': Labor', scope: x.scope, value: labor[i], timing: '% complete', guide: LAB_GUIDE, sys: x.idx });
      }
    });
    addGen('tail');
    lines.forEach((l, k) => { l.no = k + 1; });

    const sumBy = g => lines.filter(l => l.group === g).reduce((a, l) => a + l.value, 0);
    const bucket = { precon: sumBy('precon'), start: sumBy('start'), materials: sumBy('materials'), ongoing: sumBy('ongoing'), labor: sumBy('labor'), tail: sumBy('tail') };
    // In billing order: what you can bill before you're on site, at site start, as work progresses, at closeout.
    const buckets = [
      { key: 'precon', label: 'Precon lines', value: bucket.precon },
      { key: 'materials', label: 'Materials', value: bucket.materials },
      { key: 'start', label: 'Site start', value: bucket.start },
      { key: 'progress', label: 'Labor, equipment & PM', value: bucket.labor + bucket.ongoing },
      { key: 'tail', label: 'Cleanup & closeout', value: bucket.tail }
    ];

    const tot = k => sys.reduce((a, x) => a + x[k], 0);
    const sumM = tot('M'), sumL = tot('L'), sumE = tot('E'), sumOH = tot('OH'), sumPR = tot('PR'), sumTAX = tot('TAX');
    const sumMat = mat.reduce((a, b) => a + b, 0);
    const sumLab = labor.reduce((a, b) => a + b, 0);
    const pmValue = gen.find(g => g.id === 'pm').value;

    const preSite = bucket.precon + bucket.materials;   // billable before you're on site (materials only if stored material is paid)
    const atStart = preSite + bucket.start;              // most you can have billed before any installation is earned
    const btf = C - atStart;
    const remCost = sumL + sumE;
    const btfCov = remCost > 0 ? btf / remCost : null;
    const retainage = Math.round(C * retPct);

    const markup = C - sumM - sumTAX - sumL - sumE; // overhead + profit (+ sub-dollar rounding)
    const spread = [
      { key: 'precon', label: 'Precon lines', value: bucket.precon, early: true },
      { key: 'start', label: 'Site start lines', value: bucket.start, early: true },
      { key: 'matProfit', label: 'Profit on material', value: sumMat - sumM - sumTAX, early: true },
      { key: 'pm', label: 'Project management', value: pmValue },
      { key: 'eqProfit', label: 'Profit on equipment', value: EQ - sumE },
      { key: 'laborMargin', label: 'Labor margin', value: sumLab - sumL },
      { key: 'tail', label: 'Cleanup & closeout', value: bucket.tail }
    ];
    const pulled = spread.filter(x => x.early).reduce((a, x) => a + x.value, 0);

    const sysRows = sys.map((x, i) => ({
      idx: x.idx, name: x.name, scope: x.scope, V: x.V, price: x.price, M: x.M, L: x.L, E: x.E, OH: x.OH, PR: x.PR, TAX: x.TAX,
      oh: x.oh, pr: x.pr, mk: mk[i], mat: mat[i], labor: labor[i], eq: EQalloc[i], gen: Galloc[i],
      total: mat[i] + labor[i] + EQalloc[i] + Galloc[i], floor: floor[i],
      cov: x.L > 0 ? labor[i] / x.L : null, areas: x.areas.length,
      T: x.T, tie: x.T > 0 ? x.V === x.T : null,
      tieP: x.T > 0 && x.V !== x.T ? tieProfit(inSys[x.idx], taxRate, x.T / 100) : null
    }));

    // Review checks.
    const checks = [];
    const chk = (level, title, detail, extra) => checks.push(Object.assign({ level, title, detail }, extra || {}));
    const fp = v => (v * 100).toFixed(1).replace(/\.0$/, '') + '%';
    const offBy = (a, b) => usd(Math.abs(a - b)) + (a > b ? ' over' : ' under');

    badSys.forEach(x => chk('fix', x.name + ': no cost entered', 'Enter material, labor or equipment cost for this system, or remove it.', { sys: x.idx }));

    // Totals: does everything add up to the numbers you were awarded?
    const untied = sysRows.filter(r => r.tie === false);
    const missing = sysRows.filter(r => r.T === 0);
    untied.forEach(r => chk('fix', r.name + ': prices out ' + offBy(r.V, r.T) + ' its total',
      'The estimate gives ' + usd(r.V) + '; the entered total is ' + usd(r.T) + '. ' +
      (r.tieP !== null ? 'A profit of ' + r.tieP + '% would tie it.' : 'Check the costs and percentages.'), { sys: r.idx, tieP: r.tieP }));
    if (missing.length) chk('watch', 'No system total for ' + missing.map(r => r.name).join(', '), 'Enter the awarded value for each system so the app can confirm the estimate ties to it.');
    else if (!untied.length) chk('ok', 'Every system ties to its total', 'Each estimate prices out to the awarded value you entered.');
    if (contract > 0) {
      if (C === contract) chk('ok', 'SOV total ties to the contract sum', usd(C) + ' across ' + sys.length + ' system' + (sys.length === 1 ? '' : 's') + '.');
      else chk('fix', 'SOV total is ' + offBy(C, contract) + ' the contract sum',
        'SOV total ' + usd(C) + ' against a contract sum of ' + usd(contract) + '. ' +
        (untied.length ? 'Start with the systems that don\'t tie.' : 'Check the contract sum, or whether a system is missing.'));
      const sumT = sysRows.reduce((a, r) => a + r.T, 0);
      if (!missing.length && sumT !== contract) chk('fix', 'System totals add up to ' + usd(sumT) + ', not ' + usd(contract),
        'The awarded values you entered don\'t add up to the contract sum. One of them, or the contract sum, is off.');
    } else {
      chk('watch', 'No contract sum entered', 'Enter it on the Systems tab so the SOV total can be checked against it.');
    }

    // Overhead is what pays for the general lines.
    if (sumOH < G) chk('watch', 'Overhead is ' + usd(G - sumOH) + ' short of the general lines',
      'Overhead ' + usd(sumOH) + ' against ' + usd(G) + ' of general lines. Labor makes up the difference, which thins your labor lines.');
    else chk('ok', 'Overhead covers the general lines',
      'Overhead ' + usd(sumOH) + ' against ' + usd(G) + ' of general lines. The extra ' + usd(sumOH - G) + ' goes to labor.');

    sysRows.forEach(r => {
      const cmp = { kind: 'labor', a: r.labor, b: r.L };
      if (r.labor < 0) {
        chk('fix', r.name + ': labor line is negative', 'The general lines take more than this system\'s overhead and labor can carry. Lower the general line percentages or check the inputs.', { sys: r.idx, cmp });
      } else if (r.L === 0) {
        if (r.labor > 0) chk('watch', r.name + ': labor line with no labor cost', 'Overhead and profit are sitting in a labor line with no install estimate behind it. Enter the install cost, or accept it if this is supply-only.', { sys: r.idx });
      } else if (r.labor < r.L) {
        chk('fix', r.name + ': labor scheduled below labor cost', 'Once materials are billed, the remaining labor value won\'t cover your crews, and a GC checking unit rates will see it. Lower the general line percentages or raise overhead.', { sys: r.idx, cmp });
      } else if (r.labor < r.floor) {
        chk('watch', r.name + ': labor margin under your ' + fp(f) + ' floor', 'Labor cost is covered, but with less cushion than your floor. Thin labor lines are the first thing a GC questions on a front-loaded SOV.', { sys: r.idx, cmp });
      } else {
        chk('ok', r.name + ': labor covered', 'Scheduled labor stays above cost plus your ' + fp(f) + ' floor.', { sys: r.idx, cmp });
      }
    });

    const withMat = sysRows.filter(r => r.M > 0);
    if (withMat.length) {
      const hi = withMat.reduce((a, r) => (r.mk > a.mk ? r : a), withMat[0]);
      const lo = withMat.reduce((a, r) => (r.mk < a.mk ? r : a), withMat[0]);
      const where = withMat.length > 1 ? ' on ' + hi.name : '';
      if (hi.mk > matCap + 1e-9) chk('fix', 'Material line ' + fp(hi.mk) + ' over invoice' + where, 'Over your ' + fp(matCap) + ' cap. Stored-material billing gets checked against supplier invoices, and a line this far over is likely to be cut back to invoice value. The markup comes from this system\'s profit %.');
      else if (hi.mk > matComfort + 1e-9) chk('watch', 'Material line ' + fp(hi.mk) + ' over invoice' + where, 'Above ' + fp(matComfort) + '. Defensible, but have supplier quotes or POs and freight backup ready before you bill stored material.');
      else chk('ok', 'Material lines ' + (withMat.length > 1 && lo !== hi ? fp(lo.mk) + '–' + fp(hi.mk) : fp(hi.mk)) + ' over invoice', 'At or under the ' + fp(matComfort) + ' level that usually passes without questions.');
    }

    let rangeIssues = 0;
    gen.forEach(g => {
      if (g.pct > g.high + 1e-9) {
        rangeIssues++;
        chk(g.group === 'front' ? 'fix' : 'watch', g.label + ' at ' + g.pct.toFixed(2) + '% is above ' + g.high.toFixed(2) + '%',
          g.group === 'front' ? 'Above the top of your framework range. A GC reviewer will read this as front-loading.' : 'Above the top of your framework range. Make sure the actual cost supports it.', { line: g.id });
      } else if (g.pct < g.low - 1e-9) {
        rangeIssues++;
        chk('watch', g.label + ' at ' + g.pct.toFixed(2) + '% is below ' + g.low.toFixed(2) + '%',
          g.group === 'tail' ? 'A thin tail leaves little value for punch and closeout documents. GCs often push back and ask for more.' : 'Below the bottom of your framework range. You may be leaving early, defensible value on the table.', { line: g.id });
      }
    });
    if (!rangeIssues) chk('ok', 'General lines inside your framework ranges', 'Every percentage-based line sits between its low and high value.');

    if (sumE === 0) chk('watch', 'No equipment entered', 'Most cladding scopes need lifts or hoisting. If equipment is buried in labor, the labor lines carry it instead.');
    else {
      const eqp = EQ / C;
      if (eqp < EQUIP.low / 100 - 1e-9 || eqp > EQUIP.high / 100 + 1e-9) chk('watch', 'Equipment is ' + (eqp * 100).toFixed(2) + '% of the contract', 'Outside the 2–4% Orafol range. That\'s fine if it matches your rental and hoisting plan, but expect a question.');
      else chk('ok', 'Equipment at ' + (eqp * 100).toFixed(2) + '% of the contract', 'Within the 2–4% range, billed progressively with usage.');
    }

    if (btfCov !== null) {
      const cmp = { kind: 'btf', a: btf, b: remCost };
      if (btfCov < 1) chk('fix', 'Balance to finish is short of field cost', 'Once precon lines, materials and site start are billed, what is left won\'t pay for the labor and equipment still to come. That is the textbook overloaded SOV.', { cmp });
      else if (btfCov < 1.10) chk('watch', 'Balance to finish is tight', 'Once precon lines, materials and site start are billed, what is left barely covers the labor and equipment still to come. A GC or surety would see little room to replace you if the job stalled.', { cmp });
      else chk('ok', 'Balance to finish covers field cost', 'Once precon lines, materials and site start are billed, what is left pays the labor and equipment still to come with room to spare.', { cmp });
    }

    if (bond > 0 && bond / C > 0.03) chk('watch', 'Bond line is ' + (bond / C * 100).toFixed(2) + '% of the contract', 'That is high for a P&P bond premium. Bill it only at the amount on the surety invoice.');

    const rank = { fix: 0, watch: 1, ok: 2 };
    checks.sort((a, b) => rank[a.level] - rank[b.level]);
    const counts = { fix: 0, watch: 0, ok: 0 };
    checks.forEach(c => { counts[c.level]++; });

    const total = lines.reduce((a, l) => a + l.value, 0);
    const cents = C % 100 !== 0 || lines.some(l => l.value % 100 !== 0);

    return {
      empty: false, C, total, cents, contract, posture: isCustom ? 'custom' : posture, isCustom, pct,
      matCap, matComfort, floorPct: f, retPct, taxRate,
      sumM, sumL, sumE, sumOH, sumPR, sumTAX, markup, EQ, bond, G, gen, lines, buckets, preSite, atStart, btf, remCost, btfCov,
      retainage, spread, pulled, sysRows, checks, counts, badSys
    };
  }

  const api = { GENERAL, EQUIP, POSTURES, DEFAULT_SETTINGS, compute, presetPct, priceSystem, tieProfit, allocate, toCents };
  root.SOVEngine = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
(function () {
  'use strict';
  const E = window.SOVEngine;
  const KEY = 'sovAllocationBuilder.v1';
  const TABS = ['systems', 'sov', 'review', 'settings'];
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money = (c, cents) => (c < 0 ? '−$' : '$') + (cents ? nf2.format(Math.abs(c) / 100) : nf0.format(Math.round(Math.abs(c) / 100)));
  const money2 = c => (c < 0 ? '−$' : '$') + nf2.format(Math.abs(c) / 100);
  const moneyAuto = c => money(c, Math.round(Math.abs(c)) % 100 !== 0);
  const pc = (x, d) => (x * 100).toFixed(d == null ? 2 : d) + '%';
  const pc1 = x => pc(x, 1);
  const trimNum = n => String(Math.round(n * 100) / 100);
  const trim4 = n => String(Math.round((Number(n) || 0) * 1e4) / 1e4);
  const parseNum = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
  const moneyInput = n => (n ? nf2.format(n) : '');

  const ICON = {
    copy: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6.5" y="6.5" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 6.5V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v7A1.5 1.5 0 0 0 5 13.5h1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
    x: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    plus: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
  };
  const GLYPH = {
    ok: '<svg viewBox="0 0 16 16"><path d="M4 8.4l2.6 2.6L12 5.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    watch: '<svg viewBox="0 0 16 16"><path d="M8 4.2v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="8" cy="12" r="1.2" fill="currentColor"/></svg>',
    fix: '<svg viewBox="0 0 16 16"><path d="M5 5l6 6M11 5l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'
  };
  const LEVEL_WORD = { ok: 'OK', watch: 'Watch', fix: 'Fix' };
  const statusIcon = lvl => '<span class="sic ' + lvl + '" role="img" aria-label="' + LEVEL_WORD[lvl] + '">' + GLYPH[lvl] + '</span>';

  const blankSystem = () => ({ name: '', scope: '', total: 0, M: 0, L: 0, E: 0, oh: 0, pr: 0, areas: [] });
  const exampleState = () => ({
    v: 2, isExample: true, tab: 'sov', project: 'Example: Warehouse Addition', contract: 599687,
    posture: 'balanced', custom: null, settings: Object.assign({}, E.DEFAULT_SETTINGS),
    systems: [
      { name: 'Insulated Metal Panels (IMP)', scope: 'Base Bid', total: 427282, M: 212000, L: 118000, E: 12000, oh: 10, pr: 10,
        areas: [{ name: 'North Elevation', w: 35 }, { name: 'West Elevation', w: 25 }, { name: 'South Elevation', w: 40 }] },
      { name: 'Fiber Cement Panels', scope: 'Alt #1', total: 150360, M: 48000, L: 71000, E: 5000, oh: 10, pr: 8, areas: [] },
      { name: 'Aluminum Canopy', scope: 'Alt #2', total: 22045, M: 11800, L: 5200, E: 600, oh: 10, pr: 10, areas: [] }
    ]
  });

  // Saved data from the first version had OH&P in dollars. Keep the costs, carry the old markup as profit %.
  function migrateV1(s) {
    const keep = {};
    ['laborFloor', 'matComfort', 'matCap', 'retainage', 'bond', 'rounding'].forEach(k => { if (s.settings && s.settings[k] != null) keep[k] = s.settings[k]; });
    return {
      v: 2, isExample: false, tab: s.tab, project: s.project || '', contract: 0,
      posture: s.posture === 'custom' && s.custom ? 'custom' : (E.POSTURES[s.posture] ? s.posture : 'balanced'),
      custom: s.custom ? { pct: s.custom.pct || {} } : null,
      settings: Object.assign({}, E.DEFAULT_SETTINGS, keep),
      systems: s.systems.map(x => {
        x = x || {};
        const cost = (+x.M || 0) + (+x.L || 0) + (+x.E || 0);
        return { name: x.name || '', scope: x.scope || '', total: 0, M: +x.M || 0, L: +x.L || 0, E: +x.E || 0, oh: 0,
          pr: cost > 0 ? Math.round((+x.P || 0) / cost * 1e6) / 1e4 : 0, areas: Array.isArray(x.areas) ? x.areas : [] };
      })
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      let s = JSON.parse(raw);
      if (!s || !Array.isArray(s.systems)) return null;
      if (s.v === 1) { if (s.isExample) return null; s = migrateV1(s); }
      if (s.v !== 2) return null;
      s.settings = Object.assign({}, E.DEFAULT_SETTINGS, s.settings || {});
      s.systems = s.systems.map(x => Object.assign(blankSystem(), x, { areas: Array.isArray(x && x.areas) ? x.areas : [] }));
      if (!s.systems.length) s.systems.push(blankSystem());
      if (TABS.indexOf(s.tab) < 0) s.tab = 'systems';
      return s;
    } catch (e) { return null; }
  }
  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }, 250);
  }

  let state = load() || exampleState();
  let R = null;
  const ui = { expanded: new Set(), armed: {}, openAreas: new Set(), hl: null };
  const recompute = () => { R = E.compute(state); };
  const taxRate = () => Math.max(0, Number(state.settings.taxRate) || 0);

  /* ---------- shared bits ---------- */
  function exampleBanner() {
    if (!state.isExample) return '';
    return '<div class="banner" role="note"><strong>Example numbers.</strong> Replace them with your estimate on the Systems tab, or <button type="button" class="linkbtn" data-act="start-blank">start blank</button>.</div>';
  }
  function emptyState() {
    return '<div class="card empty"><div class="eyebrow">Nothing to schedule yet</div><p>Enter material, labor and equipment cost plus overhead and profit for at least one system. The SOV builds as you type.</p><button class="btn primary" type="button" data-go="systems">Go to Systems</button></div>';
  }
  const pctTxt = n => trimNum(Number(n) || 0) + '%';
  const postureLabel = k => (k === 'custom' ? 'Custom' : E.POSTURES[k].label);
  const offTxt = (a, b) => moneyAuto(Math.abs(a - b)) + (a > b ? ' over' : ' under');

  /* ---------- Systems ---------- */
  function moneyField(i, k, label, v) {
    const id = 'sys-' + k + '-' + i;
    return '<div class="field"><label for="' + id + '">' + label + '</label><div class="inp"><span class="pre">$</span><input id="' + id + '" data-k="' + k + '" data-money inputmode="decimal" autocomplete="off" placeholder="0.00" value="' + esc(moneyInput(v)) + '"></div></div>';
  }
  function pctField(i, k, label, v) {
    const id = 'sys-' + k + '-' + i;
    return '<div class="field"><label for="' + id + '">' + label + '</label><div class="inp"><input id="' + id + '" data-k="' + k + '" data-pct4 inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(v ? trim4(v) : '') + '"><span class="suf">%</span></div></div>';
  }
  function systemCard(s, i) {
    const open = s.areas.length > 0 || ui.openAreas.has(i);
    let areas = '';
    s.areas.forEach((a, k) => {
      areas += '<div class="area-row" data-a="' + k + '">' +
        '<input class="txt" id="area-name-' + i + '-' + k + '" data-ak="name" aria-label="Area name" placeholder="North Elevation" autocomplete="off" value="' + esc(a.name) + '">' +
        '<div class="inp"><input id="area-w-' + i + '-' + k + '" data-ak="w" data-pct inputmode="decimal" aria-label="Weight" placeholder="0" autocomplete="off" value="' + esc(a.w ? trimNum(a.w) : '') + '"><span class="suf">%</span></div>' +
        '<button type="button" class="icon-btn" data-act="remove-area" aria-label="Remove area">' + ICON.x + '</button></div>';
    });
    return '<section class="card sys" data-i="' + i + '" aria-label="System ' + (i + 1) + '">' +
      '<div class="sys-head"><div class="field"><label for="sys-name-' + i + '">System ' + (i + 1) + '</label>' +
      '<input class="txt strong" id="sys-name-' + i + '" data-k="name" list="sys-names" autocomplete="off" placeholder="Insulated Metal Panels (IMP)" value="' + esc(s.name) + '"></div>' +
      '<button type="button" class="icon-btn" data-act="remove-system" aria-label="Remove system ' + (i + 1) + '">' + ICON.x + '</button></div>' +
      '<div class="grid2"><div class="field"><label for="sys-scope-' + i + '">Contract scope</label><input class="txt" id="sys-scope-' + i + '" data-k="scope" autocomplete="off" placeholder="Base Bid, Alt #3…" value="' + esc(s.scope) + '"></div>' +
      moneyField(i, 'total', 'System total', s.total) + '</div>' +
      '<div class="grid2">' + moneyField(i, 'M', 'Material', s.M) + moneyField(i, 'L', 'Labor', s.L) + moneyField(i, 'E', 'Equipment / fixed', s.E) +
      '<div class="pair">' + pctField(i, 'oh', 'Overhead', s.oh) + pctField(i, 'pr', 'Profit', s.pr) + '</div></div>' +
      '<div class="recap" id="sys-recap-' + i + '" aria-live="polite"></div>' +
      '<details class="areas" data-i="' + i + '"' + (open ? ' open' : '') + '><summary>Split labor by area</summary>' +
      '<div class="area-list">' + areas +
      '<div><button type="button" class="btn small" data-act="add-area">' + ICON.plus + ' Add area</button></div>' +
      '<p class="note">Labor splits by these weights. They don\'t need to add up to 100.</p></div></details>' +
      '</section>';
  }
  function recapHTML(s) {
    const tr = taxRate();
    const p = E.priceSystem(s, tr);
    if (p.Sub <= 0) return '<p class="note">Enter material, labor and equipment cost to price this system.</p>';
    let h = '<div class="rc"><span>Subtotal</span><span>' + money2(p.Sub) + '</span></div>' +
      '<div class="rc"><span>Overhead ' + trim4(p.oh) + '%</span><span>' + money2(p.OH) + '</span></div>' +
      '<div class="rc"><span>Profit ' + trim4(p.pr) + '% on subtotal + overhead</span><span>' + money2(p.PR) + '</span></div>' +
      '<div class="rc"><span>Sales tax ' + trim4(tr) + '% on material</span><span>' + money2(p.TAX) + '</span></div>' +
      '<div class="rc tot"><span>System price</span><span>' + money2(p.price) + '</span></div>';
    if (p.price !== p.V) h += '<div class="rc sub"><span>Rounded for the SOV</span><span>' + money2(p.V) + '</span></div>';
    const T = E.toCents(s.total);
    if (!T) return h + '<div class="tie"><span class="tie-txt">Enter the system total to check this estimate against it.</span></div>';
    if (T === p.V) return h + '<div class="tie">' + statusIcon('ok') + '<span class="tie-txt">Ties to the ' + moneyAuto(T) + ' system total' + (R && !R.empty ? ', ' + pc1(p.V / R.C) + ' of the SOV' : '') + '.</span></div>';
    const tp = E.tieProfit(s, tr, T / 100);
    return h + '<div class="tie">' + statusIcon('fix') + '<span class="tie-txt">' + offTxt(p.V, T) + ' the ' + moneyAuto(T) + ' system total.</span>' +
      (tp !== null ? '<button type="button" class="btn small" data-act="tie-profit" data-p="' + tp + '">Set profit to ' + tp + '%</button>'
        : '<span class="note">Profit alone can\'t close this gap. Check the costs and overhead.</span>') + '</div>';
  }
  function contractTieHTML() {
    const contract = E.toCents(state.contract);
    if (!contract) return '<div class="tie"><span class="tie-txt">Enter the contract sum to check that the systems add up to it.</span></div>';
    if (!R || R.empty) return '<div class="tie"><span class="tie-txt">Add a system to compare against the ' + moneyAuto(contract) + ' contract sum.</span></div>';
    const n = R.sysRows.length;
    if (R.C === contract) return '<div class="tie">' + statusIcon('ok') + '<span class="tie-txt">' + n + ' system' + (n === 1 ? '' : 's') + ' add up to ' + money(R.C) + '. Ties to the contract sum.</span></div>';
    return '<div class="tie">' + statusIcon('fix') + '<span class="tie-txt">Systems add up to ' + moneyAuto(R.C) + ', ' + offTxt(R.C, contract) + ' the contract sum.</span></div>';
  }
  function renderSystems() {
    let h = exampleBanner();
    h += '<div class="card"><div class="grid2"><div class="field"><label for="project">Project</label><input class="txt" id="project" autocomplete="off" placeholder="Project name" value="' + esc(state.project) + '"></div>' +
      '<div class="field"><label for="contract">Contract sum</label><div class="inp"><span class="pre">$</span><input id="contract" data-money inputmode="decimal" autocomplete="off" placeholder="0.00" value="' + esc(moneyInput(state.contract)) + '"></div></div></div>' +
      '<div id="contract-tie" aria-live="polite"></div></div>';
    state.systems.forEach((s, i) => { h += systemCard(s, i); });
    h += '<div class="sys-actions"><button type="button" class="btn" data-act="add-system">' + ICON.plus + ' Add system</button><button type="button" class="btn ghost" data-act="clear-all">Clear all</button></div>';
    $('#panel-systems').innerHTML = h;
    updateRecaps();
  }
  function updateRecaps() {
    state.systems.forEach((s, i) => { const el = $('#sys-recap-' + i); if (el) el.innerHTML = recapHTML(s); });
    const ct = $('#contract-tie');

  /* ---------- SOV ---------- */
  function postureButtons() {
    const keys = ['conservative', 'balanced', 'max'].concat(state.custom ? ['custom'] : []);
    return keys.map(k => '<button type="button" data-posture="' + k + '" aria-pressed="' + (R.posture === k) + '">' + postureLabel(k) + '</button>').join('');
  }
  function postureNote() {
    if (R.posture === 'conservative') return 'Precon and site-start lines at the low end of your ranges, with more held back for cleanup and closeout.';
    if (R.posture === 'balanced') return 'Your framework\'s selected percentage on every general line.';
    if (R.posture === 'max') return 'Precon and site-start lines at the top of their ranges. Your overhead has to pay for them, so keep an eye on the labor checks.';
    return 'Your own percentages from Settings. Review still checks every guardrail.';
  }
  function heroTie() {
    const c = R.contract;
    if (!c) return '<p class="hero-tie"><span>No contract sum entered to check against.</span></p>';
    if (R.C === c) return '<p class="hero-tie">' + statusIcon('ok') + '<span>Ties to the contract sum</span></p>';
    return '<p class="hero-tie">' + statusIcon('fix') + '<span>' + offTxt(R.C, c) + ' the ' + moneyAuto(c) + ' contract sum</span></p>';
  }
  function kpis() {
    const cov = R.btfCov;
    const lvl = cov === null ? 'ok' : cov < 1 ? 'fix' : cov < 1.1 ? 'watch' : 'ok';
    return '<div class="eyebrow">SOV total' + (state.project ? ' · ' + esc(state.project) : '') + '</div>' +
      '<div class="hero-num">' + money(R.C, R.cents) + '</div>' + heroTie() +
      '<p class="note">' + R.sysRows.length + ' system' + (R.sysRows.length === 1 ? '' : 's') + ' · ' + R.lines.length + ' SOV lines</p>' +
      '<div class="tiles">' +
      '<div class="tile"><div class="t-lbl">Before site start</div><div class="t-num">' + pc1(R.preSite / R.C) + '</div><div class="t-sub">' + money(R.preSite) + ' in precon lines and stored materials</div></div>' +
      '<div class="tile"><div class="t-lbl">Left to finish</div><div class="t-num">' + (cov === null ? '—' : cov.toFixed(2) + '×') + ' ' + (cov === null ? '' : statusIcon(lvl)) + '</div><div class="t-sub">' + money(R.btf) + ' left after mobilization vs ' + money(R.remCost) + ' labor + equipment</div></div>' +
      '<div class="tile"><div class="t-lbl">Retainage held</div><div class="t-num">' + money(R.retainage) + '</div><div class="t-sub">' + pctTxt(state.settings.retainage) + ' of each billing until closeout</div></div>' +
      '</div>';
  }
  function flow() {
    let segs = '';
    R.buckets.forEach((b, i) => {
      if (b.value > 0) segs += '<span class="seg s' + (i + 1) + '" style="flex-grow:' + b.value + '" data-b="' + b.key + '"></span>';

      legend += '<div class="lg' + (ui.hl === b.key ? ' hl' : '') + '" data-b="' + b.key + '"><span class="sw s' + (i + 1) + '"></span><span>' + esc(b.label) + '</span><span class="lg-amt">' + money(b.value, R.cents) + '</span><span class="lg-pc">' + pc1(b.value / R.C) + '</span></div>';
    });
    return '<div class="flow"><div class="flow-head"><span class="eyebrow">When the SOV bills</span><span class="note">early → late</span></div>' +
      '<div class="flowbar" aria-hidden="true">' + segs + '<div class="flow-tip" hidden></div></div>' +
      '<div class="legend">' + legend + '</div></div>';
  }
  const GROUPS = [['precon', 'Preconstruction'], ['start', 'Site start'], ['ongoing', 'Ongoing'], ['materials', 'Materials'], ['labor', 'Field labor'], ['tail', 'Closeout']];
  function row(l) {
    const open = ui.expanded.has(l.id);

    const chip = '<span class="chip' + (preSite ? ' front' : '') + '">' + esc(l.timing) + '</span>';
    return '<div class="row" role="button" tabindex="0" aria-expanded="' + open + '" data-line="' + esc(l.id) + '">' +
      '<span class="no">' + l.no + '</span>' +
      '<span class="d"><span class="d1">' + esc(l.desc) + '</span><span class="d2">' + chip + (l.scope ? '<span>' + esc(l.scope) + '</span>' : '') + '</span></span>' +
      '<span class="v' + (l.value < 0 ? ' neg' : '') + '">' + money(l.value, R.cents) + '<span class="p">' + pc(l.value / R.C) + '</span></span>' +
      '<span class="guide"' + (open ? '' : ' hidden') + '>' + esc(l.guide) + '</span></div>';
  }
  function sheet() {
    let h = '<div class="card sheet"><div class="sheet-title"><span class="eyebrow">Schedule of values</span><span class="note">Tap a line for billing guidance</span></div>' +
      '<div class="sheet-head" aria-hidden="true"><span>Item</span><span>Description of work</span><span class="r">Scheduled value</span></div>';

    });

  }
  function renderSOV() {
    const el = $('#panel-sov');
    if (R.empty) { el.innerHTML = exampleBanner() + emptyState(); return; }
    el.innerHTML = exampleBanner() +
      '<div class="card posture"><div class="eyebrow">Front-load posture</div>' +
      '<div class="seg-ctl' + (state.custom ? ' four' : '') + '" role="group" aria-label="Front-load posture">' + postureButtons() + '</div>' +
      '<p class="note">' + postureNote() + '</p>' +
      '<p class="note">Material lines carry material cost, sales tax and each system\'s share of profit. Overhead pays for the general lines. Both percentages are set per system on the Systems tab.</p></div>' +
      '<div class="card">' + kpis() + flow() + '</div>' +
      sheet() +
      '<div class="copy-row"><button type="button" class="btn primary" id="copy-sov">' + ICON.copy + 'Copy SOV for Excel</button>' +
      '<p class="note">Pastes as columns: item, description of work, scheduled value, % of total, billing timing.</p>' +
      '<div id="copy-fallback" hidden><label class="lbl" for="copy-text">Select all and copy</label><textarea id="copy-text" readonly></textarea></div></div>';
  }

  /* ---------- Review ---------- */
  function checkRow(c) {
    let cmp = '';
    if (c.cmp && c.cmp.kind === 'labor') {
      const d = c.cmp.b ? c.cmp.a / c.cmp.b - 1 : 0;
      cmp = '<div class="ck-cmp">Scheduled ' + money(c.cmp.a) + ' · cost ' + money(c.cmp.b) + ' · ' + (d >= 0 ? '+' : '−') + pc1(Math.abs(d)) + '</div>';
    } else if (c.cmp && c.cmp.kind === 'btf') {
      cmp = '<div class="ck-cmp">Left after site start ' + money(c.cmp.a) + ' · labor + equipment still to come ' + money(c.cmp.b) + '</div>';
    }
    return '<div class="check">' + statusIcon(c.level) + '<div><div class="ck-lvl">' + LEVEL_WORD[c.level] + '</div><div class="ck-t">' + esc(c.title) + '</div><div class="ck-d">' + esc(c.detail) + '</div>' + cmp + '</div></div>';
  }
  function renderReview() {
    const el = $('#panel-review');
    if (R.empty) {
      el.innerHTML = emptyState() + (R.badSys && R.badSys.length ? '<div class="card checks">' + R.badSys.map(x => checkRow({ level: 'fix', title: x.name + ': no cost entered', detail: 'Enter material, labor or equipment cost for this system, or remove it.' })).join('') + '</div>' : '');
      return;
    }
    const n = R.counts;
    const lvl = n.fix ? 'fix' : n.watch ? 'watch' : 'ok';
    const head = n.fix ? n.fix + ' to fix' + (n.watch ? ' · ' + n.watch + ' to watch' : '') : n.watch ? n.watch + ' to watch' : 'All checks pass';
    let h = '<div class="card"><div class="sum-line">' + statusIcon(lvl) + '<span>' + head + '</span></div>' +
      '<p class="note" style="margin-top:6px">These are the questions a GC reviewer is most likely to ask. Clear the Fix items before you submit.</p></div>';
    h += '<div class="card checks">' + R.checks.map(checkRow).join('') + '</div>';

    const mk = R.markup;
    h += '<div class="card"><div class="eyebrow">Where your overhead and profit go</div>';
    h += R.sumOH >= R.G
      ? '<p class="lead">Your ' + money(R.sumOH) + ' of overhead covers the ' + money(R.G) + ' of general lines, with ' + money(R.sumOH - R.G) + ' left over for labor.'
      : '<p class="lead">Your ' + money(R.sumOH) + ' of overhead is ' + money(R.G - R.sumOH) + ' short of the ' + money(R.G) + ' of general lines, so labor covers the gap.';
    h += mk > 0 ? ' ' + pc(R.pulled / mk, 0) + ' of your ' + money(mk) + ' overhead and profit is billed before any installation is earned.</p>' : '</p>';
    R.spread.forEach(s => {
      const w = mk > 0 ? Math.max(0, Math.min(1, s.value / mk)) : 0;
      h += '<div class="sp-row' + (s.early ? ' early' : '') + '"><span class="sp-name">' + esc(s.label) + (s.early ? ' <span class="chip front">Early</span>' : '') + '</span>' +
        '<span class="sp-val' + (s.value < 0 ? ' neg' : '') + '">' + money(s.value) + '<span class="p">' + (mk > 0 ? pc1(s.value / mk) : '') + '</span></span>' +
        '<span class="sp-bar"><i style="width:' + (w * 100).toFixed(2) + '%"></i></span></div>';
    });
    h += '<p class="note" style="margin-top:10px">Overhead pays for the general lines. Profit is spread over material, equipment and labor in proportion to cost. Sales tax rides with material and isn\'t marked up.</p></div>';

    h += '<div class="card"><div class="eyebrow">Scope reconciliation</div><p class="note" style="margin-top:4px">Each system\'s lines plus its share of the shared lines add back to its price. Same test as the Scope Reconciliation sheet.</p>';
    R.sysRows.forEach(r => {
      const d = r.L > 0 ? r.labor / r.L - 1 : null;
      let tie;
      if (r.tie === true) tie = '<div class="rc-cov">' + statusIcon('ok') + ' Ties to the ' + moneyAuto(r.T) + ' system total</div>';
      else if (r.tie === false) tie = '<div class="rc-cov">' + statusIcon('fix') + ' ' + offTxt(r.V, r.T) + ' the ' + moneyAuto(r.T) + ' system total</div>';
      else tie = '<div class="rc-cov">No system total entered</div>';
      h += '<div class="recon"><div class="rc-head"><span class="rc-name">' + esc(r.name) + (r.scope ? '<span class="rc-scope">' + esc(r.scope) + '</span>' : '') + '</span><span class="rc-v">' + money(r.V, R.cents) + '</span></div><dl>' +
        '<dt>Material' + (r.M > 0 ? ' <span class="muted">(with tax, ' + pc1(r.mk) + ' over invoice)</span>' : '') + '</dt><dd>' + money(r.mat, R.cents) + '</dd>' +
        '<dt>Labor' + (r.areas ? ' <span class="muted">(' + r.areas + ' areas)</span>' : '') + '</dt><dd' + (r.labor < 0 ? ' class="neg"' : '') + '>' + money(r.labor, R.cents) + '</dd>' +
        '<dt>Equipment share</dt><dd>' + money(r.eq, R.cents) + '</dd>' +
        '<dt>Shared general lines</dt><dd>' + money(r.gen, R.cents) + '</dd>' +
        '<dt class="rc-tot">System price</dt><dd class="rc-tot">' + money(r.total, R.cents) + '</dd></dl>' + tie +
        (d !== null ? '<div class="rc-cov">Labor ' + money(r.labor) + ' against cost ' + money(r.L) + ' · ' + (d >= 0 ? '+' : '−') + pc1(Math.abs(d)) + '</div>' : '') + '</div>';
    });
    h += '<p class="note" style="margin-top:10px">Shared general lines are split by system price. The equipment line is split by each system\'s equipment cost plus its profit.</p></div>';
    el.innerHTML = h;
  }

  /* ---------- Settings ---------- */
  function currentPct() {
    if (!R.empty) return R.pct;
    if (state.posture === 'custom' && state.custom) return Object.assign(E.presetPct('balanced'), state.custom.pct);
    return E.presetPct(E.POSTURES[state.posture] ? state.posture : 'balanced');
  }
  function setRow(id, attrs, label, hint, value, suffix, prefix) {
    return '<div class="set-row"><label for="' + id + '" class="set-name">' + label + '<span class="set-hint">' + hint + '</span></label>' +
      '<div class="inp">' + (prefix ? '<span class="pre">' + prefix + '</span>' : '') + '<input id="' + id + '" ' + attrs + ' inputmode="decimal" autocomplete="off" value="' + esc(value) + '">' + (suffix ? '<span class="suf">' + suffix + '</span>' : '') + '</div></div>';
  }
  function renderSettings() {
    const s = state.settings;
    const pct = currentPct();
    const custom = state.posture === 'custom' && state.custom;
    let h = '<div class="card"><div class="eyebrow">General line percentages</div><p class="note" style="margin-top:4px">' +
      (custom ? 'Custom values.' : 'Showing the ' + esc(postureLabel(state.posture)) + ' preset.') + ' Editing a line switches the SOV to Custom. These are paid for by overhead.</p>';
    E.GENERAL.forEach(g => {
      h += setRow('pct-' + g.id, 'data-gen="' + g.id + '" data-pct', esc(g.label), 'Range ' + g.low.toFixed(2) + '–' + g.high.toFixed(2) + '% · selected ' + g.sel.toFixed(2) + '% · ' + esc(g.timing.toLowerCase()), Number(pct[g.id]).toFixed(2), '%');
    });
    h += '</div>';

    h += '<div class="card"><div class="eyebrow">Estimate</div>';
    h += setRow('set-taxRate', 'data-set="taxRate" data-pct4', 'Sales tax on material', 'Added to material cost and billed with it, not marked up. Use 0 for a tax-exempt job', trim4(s.taxRate), '%');
    h += '</div>';

    h += '<div class="card"><div class="eyebrow">Guardrails</div><p class="note" style="margin-top:4px">These are judgment calls, not contract terms. Set them to what your GCs actually accept.</p>';
    h += setRow('set-laborFloor', 'data-set="laborFloor" data-pct', 'Labor floor', 'Labor lines should stay at least this far above labor cost', trimNum(s.laborFloor), '%');
    h += setRow('set-matComfort', 'data-set="matComfort" data-pct', 'Material over invoice, comfortable', 'Invoice = material + tax. Above this, Review asks you to have backup ready', trimNum(s.matComfort), '%');
    h += setRow('set-matCap', 'data-set="matCap" data-pct', 'Material over invoice, cap', 'Above this, Review flags the material line', trimNum(s.matCap), '%');
    h += '</div>';

    h += '<div class="card"><div class="eyebrow">Contract</div>';
    h += setRow('set-retainage', 'data-set="retainage" data-pct', 'Retainage', 'Held from every billing until closeout', trimNum(s.retainage), '%');
    h += setRow('set-bond', 'data-set="bond" data-money', 'P&amp;P bond premium', 'Adds a precon bond line at the invoiced premium, paid from overhead. Leave blank if there is no bond', moneyInput(s.bond), '', '$');
    h += '<div class="set-row" style="grid-template-columns:1fr"><div class="set-name">Round general lines to<span class="set-hint">Material, equipment and labor lines stay to the dollar</span></div>' +
      '<div class="seg-ctl round-ctl" role="group" aria-label="Rounding">' + [1, 10, 50, 100].map(n => '<button type="button" data-round="' + n + '" aria-pressed="' + (Number(s.rounding) === n) + '">$' + n + '</button>').join('') + '</div></div>';
    h += '</div>';

    h += '<div class="sys-actions"><button type="button" class="btn ghost" data-act="reset-settings">Reset to framework defaults</button></div>';
    h += '<p class="note">Ranges and selected values come from the Orafol Percentage Framework. Your entries are saved in this browser only.</p>';
    $('#panel-settings').innerHTML = h;
  }
  function syncSettings() {
    const panel = $('#panel-settings');
    if (!panel.contains(document.activeElement)) { renderSettings(); return; }
    const pct = currentPct();
    E.GENERAL.forEach(g => { const el = $('#pct-' + g.id); if (el && el !== document.activeElement) el.value = Number(pct[g.id]).toFixed(2); });
  }

  /* ---------- chrome ---------- */
  function renderSumbar() {
    const el = $('#sumbar');
    if (R.empty) {
      el.innerHTML = '<div class="sumbar-inner"><div><div class="eyebrow">SOV total</div><div class="sb-amt">$0</div></div><button type="button" class="status-btn" data-go="systems">Add a system</button></div>';
      return;
    }
    const n = R.counts;
    const lvl = n.fix ? 'fix' : n.watch ? 'watch' : 'ok';
    const txt = n.fix ? n.fix + ' to fix' + (n.watch ? ' · ' + n.watch + ' to watch' : '') : n.watch ? n.watch + ' to watch' : 'All checks pass';
    el.innerHTML = '<div class="sumbar-inner"><div><div class="eyebrow">SOV total</div><div class="sb-amt">' + money(R.C, R.cents) + '</div></div>' +
      '<button type="button" class="status-btn" data-go="review" aria-label="Review: ' + txt + '">' + statusIcon(lvl) + '<span>' + txt + '</span></button></div>';
  }
  function renderTabs() {
    $$('.tab').forEach(b => { const on = b.dataset.tab === state.tab; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
    TABS.forEach(k => { $('#panel-' + k).hidden = state.tab !== k; });
    const badge = $('#review-badge');
    const n = R && !R.empty ? R.counts : { fix: 0, watch: 0 };
    const c = n.fix + n.watch;
    badge.innerHTML = c ? '<span class="tbadge ' + (n.fix ? 'fix' : 'watch') + '" aria-label="' + c + ' items">' + c + '</span>' : '';
  }
  function setTab(t) {
    if (TABS.indexOf(t) < 0) return;
    state.tab = t;
    renderTabs();
    save();
    window.scrollTo(0, 0);
  }

  function focusKey(el) {
    if (!el || el === document.body) return null;
    if (el.id) return '#' + el.id;
    for (const a of ['data-posture', 'data-round', 'data-line']) if (el.hasAttribute(a)) return '[' + a + '="' + el.getAttribute(a) + '"]';
    return null;
  }
  function renderResults() {
    const key = focusKey(document.activeElement);
    const keepFocus = !$('#panel-settings').contains(document.activeElement) && !$('#panel-systems').contains(document.activeElement);
    renderSOV();
    renderReview();
    renderSumbar();
    renderTabs();
    updateRecaps();
    syncSettings();
    if (key && keepFocus) { const el = $(key); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
  }
  function changed() { recompute(); renderResults(); save(); }
  function renderAll() { recompute(); renderSystems(); renderSettings(); renderResults(); }

  function dropExample() {
    if (!state.isExample) return;
    state.isExample = false;
    $$('.banner').forEach(b => b.remove());
  }
  function ensureCustom() {
    if (state.posture === 'custom' && state.custom) return;
    state.custom = { pct: Object.assign({}, currentPct()) };
    state.posture = 'custom';
  }
  function arm(btn, key, label, action) {
    if (ui.armed[key]) { clearTimeout(ui.armed[key]); delete ui.armed[key]; action(); return; }
    const orig = btn.innerHTML;
    btn.textContent = label;
    btn.classList.add('armed');
    ui.armed[key] = setTimeout(() => { delete ui.armed[key]; if (btn.isConnected) { btn.innerHTML = orig; btn.classList.remove('armed'); } }, 3000);
  }
  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }

  function tsv() {
    const num = c => (R.cents ? (c / 100).toFixed(2) : String(Math.round(c / 100)));
    const clean = s => String(s).replace(/[\t\r\n]+/g, ' ');
    const rows = [];
    if (state.project) rows.push(['Project', clean(state.project)]);
    rows.push(['Item No.', 'Description of Work', 'Scheduled Value', '% of Total', 'Billing']);
    R.lines.forEach(l => rows.push([l.no, clean(l.desc + (l.scope ? ' (' + l.scope + ')' : '')), num(l.value), pc(l.value / R.C), l.timing]));
    rows.push(['', 'Grand Total', num(R.total), '100.00%', '']);
    return rows.map(r => r.join('\t')).join('\n');
  }
  function copySOV() {
    const text = tsv();
    const done = () => toast('SOV copied. Paste it into Excel or your G703.');
    const fallback = () => {
      const tmp = document.createElement('textarea');
      tmp.value = text;
      tmp.setAttribute('readonly', '');
      tmp.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
      document.body.appendChild(tmp);
      tmp.select();
      try { tmp.setSelectionRange(0, text.length); } catch (e) { /* older engines */ }
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      tmp.remove();
      if (ok) { done(); return; }
      const box = $('#copy-fallback'), ta = $('#copy-text');
      if (!box || !ta) return;
      ta.value = text;
      box.hidden = false;
      ta.focus();
      ta.select();
      toast('Copy is blocked here. Select the text below and copy it.');
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', ev => {
    const seg = ev.target.closest('.seg');
    if (seg) { showTip(seg); return; }
    const t = ev.target.closest('button, .row, summary');
    if (!t) { hideTip(); return; }
    if (t.classList.contains('tab')) { setTab(t.dataset.tab); return; }
    if (t.dataset.go) { setTab(t.dataset.go); return; }
    if (t.dataset.posture) { state.posture = t.dataset.posture; changed(); return; }
    if (t.dataset.round) {
      state.settings.rounding = Number(t.dataset.round); changed(); renderSettings();
      const b = $('[data-round="' + t.dataset.round + '"]'); if (b) b.focus({ preventScroll: true });
      return;
    }
    if (t.classList.contains('row')) { toggleRow(t); return; }
    if (t.id === 'copy-sov') { copySOV(); return; }
    const act = t.dataset.act;
    if (!act) return;
    const card = t.closest('[data-i]');
    const i = card ? Number(card.dataset.i) : -1;
    if (act === 'add-system') {
      state.systems.push(blankSystem());
      dropExample();
      renderSystems(); changed();
      const el = $('#sys-name-' + (state.systems.length - 1));
      if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
    } else if (act === 'remove-system') {
      arm(t, 'rm' + i, 'Remove?', () => {
        state.systems.splice(i, 1);
        if (!state.systems.length) state.systems.push(blankSystem());
        ui.openAreas.clear();
        dropExample();
        renderSystems(); changed();
      });
    } else if (act === 'tie-profit') {
      const s = state.systems[i];
      if (!s) return;
      s.pr = Number(t.dataset.p);
      dropExample();
      changed(); renderSystems();
      const el = $('#sys-pr-' + i); if (el) el.focus({ preventScroll: true });
      toast('Profit set to ' + trim4(s.pr) + '%. ' + (s.name || 'System ' + (i + 1)) + ' now ties to its total.');
    } else if (act === 'add-area') {
      state.systems[i].areas.push({ name: '', w: 0 });
      ui.openAreas.add(i);
      renderSystems(); changed();
      const el = $('#area-name-' + i + '-' + (state.systems[i].areas.length - 1));
      if (el) el.focus();
    } else if (act === 'remove-area') {
      const a = Number(t.closest('[data-a]').dataset.a);
      state.systems[i].areas.splice(a, 1);
      renderSystems(); changed();
    } else if (act === 'clear-all') {
      arm(t, 'clear', 'Tap again to clear everything', () => {
        state.systems = [blankSystem()]; state.project = ''; state.contract = 0; state.isExample = false; ui.openAreas.clear();
        renderSystems(); changed();
      });
    } else if (act === 'start-blank') {
      state.systems = [blankSystem()]; state.project = ''; state.contract = 0; state.isExample = false; ui.openAreas.clear();
      renderSystems(); changed(); setTab('systems');
      const el = $('#project'); if (el) el.focus();
    } else if (act === 'reset-settings') {
      arm(t, 'reset', 'Tap again to reset', () => {
        state.settings = Object.assign({}, E.DEFAULT_SETTINGS); state.posture = 'balanced'; state.custom = null;
        changed(); renderSettings(); toast('Settings reset to your framework defaults.');
      });
    }
  });
  function toggleRow(t) {
    const id = t.dataset.line;
    const g = t.querySelector('.guide');
    const open = !ui.expanded.has(id);
    if (open) ui.expanded.add(id); else ui.expanded.delete(id);
    t.setAttribute('aria-expanded', String(open));
    if (g) g.hidden = !open;
  }
  document.addEventListener('keydown', ev => {
    const t = ev.target;
    if (t.classList && t.classList.contains('row') && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); toggleRow(t); }
    if (t.classList && t.classList.contains('tab') && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
      const k = TABS.indexOf(state.tab) + (ev.key === 'ArrowRight' ? 1 : -1);
      setTab(TABS[(k + TABS.length) % TABS.length]);
      $('#tab-' + state.tab).focus();
    }
  });
  document.addEventListener('toggle', ev => {
    const d = ev.target;
    if (d.matches && d.matches('details.areas')) { const i = Number(d.dataset.i); if (d.open) ui.openAreas.add(i); else ui.openAreas.delete(i); }
  }, true);

  $('#panel-systems').addEventListener('input', ev => {
    const t = ev.target;
    if (t.id === 'project') { state.project = t.value; dropExample(); changed(); return; }
    if (t.id === 'contract') { state.contract = parseNum(t.value); dropExample(); changed(); return; }
    const card = t.closest('[data-i]');
    if (!card) return;
    const s = state.systems[Number(card.dataset.i)];
    if (!s) return;
    if (t.dataset.k) s[t.dataset.k] = (t.dataset.k === 'name' || t.dataset.k === 'scope') ? t.value : parseNum(t.value);
    else if (t.dataset.ak) {
      const a = s.areas[Number(t.closest('[data-a]').dataset.a)];
      if (!a) return;
      a[t.dataset.ak] = t.dataset.ak === 'name' ? t.value : parseNum(t.value);
    } else return;
    dropExample();
    changed();
  });
  $('#panel-settings').addEventListener('input', ev => {
    const t = ev.target;
    if (t.dataset.gen) { ensureCustom(); state.custom.pct[t.dataset.gen] = parseNum(t.value); }
    else if (t.dataset.set) state.settings[t.dataset.set] = parseNum(t.value);
    else return;
    changed();
  });
  // Select the whole number on focus so typing replaces it. The value itself is never rewritten while
  // the field has focus, which would collapse a keyboard user's selection.
  document.addEventListener('focusin', ev => {
    const t = ev.target;
    if (t.matches && t.matches('.inp input')) setTimeout(() => { if (document.activeElement === t) { try { t.setSelectionRange(0, t.value.length); } catch (e) { /* not selectable */ } } }, 0);
  });
  document.addEventListener('focusout', ev => {
    const t = ev.target;
    if (!t.matches) return;
    if (t.matches('input[data-money]')) t.value = moneyInput(parseNum(t.value));
    else if (t.matches('input[data-gen]')) t.value = parseNum(t.value).toFixed(2);
    else if (t.matches('input[data-pct4]')) { const n = parseNum(t.value); t.value = (t.dataset.k === 'oh' || t.dataset.k === 'pr') && !n ? '' : trim4(n); }
    else if (t.matches('input[data-pct]')) { const n = parseNum(t.value); t.value = t.dataset.ak === 'w' && !n ? '' : trimNum(n); }
    if (t.closest && t.closest('#panel-settings')) setTimeout(() => { if (!$('#panel-settings').contains(document.activeElement)) renderSettings(); }, 0);
  });

  // Cash-flow bar tooltip: hover on desktop, tap on phones. The legend carries every value too.
  function showTip(seg) {
    const bar = seg.parentElement, tip = bar.querySelector('.flow-tip');
    const b = R.buckets.find(x => x.key === seg.dataset.b);
    if (!b || !tip) return;
    tip.textContent = b.label + ' · ' + money(b.value, R.cents) + ' · ' + pc1(b.value / R.C);
    tip.hidden = false;
    const center = seg.offsetLeft + seg.offsetWidth / 2, half = tip.offsetWidth / 2;
    tip.style.left = Math.max(half, Math.min(bar.clientWidth - half, center)) + 'px';
    ui.hl = b.key;
    $$('.lg').forEach(l => l.classList.toggle('hl', l.dataset.b === b.key));
  }
  function hideTip() {
    const tip = $('.flow-tip');
    if (tip) tip.hidden = true;
    if (ui.hl) { ui.hl = null; $$('.lg.hl').forEach(l => l.classList.remove('hl')); }
  }
  document.addEventListener('pointerover', ev => { const s = ev.target.closest && ev.target.closest('.seg'); if (s) showTip(s); });
  document.addEventListener('pointerout', ev => { const s = ev.target.closest && ev.target.closest('.seg'); if (s && !(ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('.seg'))) hideTip(); });

  renderAll();
})();
</script>
</body>
</html>
